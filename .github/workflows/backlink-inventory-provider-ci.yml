name: Backlink Inventory Provider CI

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/db/src/backlink-inventory-provider.ts"
      - "lib/db/src/dataforseo-backlink-inventory-adapter.ts"
      - "lib/db/src/dataforseo-backlink-inventory-adapter.test.ts"
      - "lib/db/src/observed-backlinks.ts"
      - "lib/db/src/observed-backlink-lifecycle.ts"
      - "lib/db/src/backlink-provider-config.ts"
      - ".github/workflows/backlink-inventory-provider-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlink-inventory-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and inventory completeness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backlink_inventory_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Run inventory-provider and lifecycle safety tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest
          --root ../..
          run
          lib/db/src/dataforseo-backlink-inventory-adapter.test.ts
          lib/db/src/observed-backlink-lifecycle.test.ts
      - name: Verify clean diff formatting
        run: git diff --check

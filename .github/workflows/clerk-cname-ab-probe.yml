name: Clerk CNAME vs proxy diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/clerk-cname-ab-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare direct Clerk frontend and same-origin proxy
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local label="$1"
            local url="$2"
            local body headers status rc code
            body="$(mktemp)"
            headers="$(mktemp)"

            set +e
            curl --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H 'Origin: https://aiedgesolutions.online' \
              -H 'Referer: https://aiedgesolutions.online/' \
              --dump-header "$headers" --output "$body" \
              "$url"
            rc=$?
            set -e

            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
            code="$(jq -r '.errors[0].code // empty' "$body" 2>/dev/null || true)"
            echo "$label curl_exit=$rc status=${status:-unavailable} error_code=${code:-none} body_bytes=$(wc -c < "$body" | tr -d ' ')"

            rm -f "$body" "$headers"
          }

          probe direct_cname https://clerk.aiedgesolutions.online/v1/environment
          probe same_origin_proxy https://aiedgesolutions.online/api/__clerk/v1/environment

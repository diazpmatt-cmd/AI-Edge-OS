name: Coolify production deploy

on:
  pull_request:
    paths:
      - .github/workflows/coolify-production-deploy.yml
  workflow_run:
    workflows: ["GHCR production images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Current main SHA to deploy (40 lowercase hex characters)"
        required: true
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: coolify-production-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove bounded deployment contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/coolify-production-deploy.yml
          grep -Fq 'COOLIFY_APP_UUID: a6y7jyyedbgfwvlh7vag7xh8' "$workflow"
          grep -Fq 'context == "ghcr/published"' "$workflow"
          grep -Fq 'if [[ "$TARGET_SHA" != "$CURRENT_MAIN_SHA" ]]' "$workflow"
          grep -Fq 'key:"IMAGE_TAG"' "$workflow"
          grep -Fq '"$base/api/v1/applications/$COOLIFY_APP_UUID/envs"' "$workflow"
          grep -Fq '"$base/api/v1/deploy"' "$workflow"
          grep -Fq '"$base/api/v1/deployments/$deployment_uuid"' "$workflow"
          if grep -Eq '/(stop|restart|delete)(["/?]|$)' "$workflow"; then
            echo "Forbidden broad Coolify control found in bounded deployment workflow." >&2
            exit 1
          fi
          echo "Bounded Coolify deployment contract validated."

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_APP_UUID: a6y7jyyedbgfwvlh7vag7xh8
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL || vars.COOLIFY_BASE_URL }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate bounded deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target SHA must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [[ -z "${COOLIFY_BASE_URL:-}" ]]; then
            echo "COOLIFY_BASE_URL is not configured." >&2
            exit 1
          fi
          if [[ -z "${COOLIFY_DEPLOY_TOKEN:-}" ]]; then
            echo "COOLIFY_DEPLOY_TOKEN is not configured." >&2
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(git rev-parse HEAD)"
          if [[ "$TARGET_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo "Refusing deploy: target $TARGET_SHA is not current main $CURRENT_MAIN_SHA." >&2
            exit 1
          fi
          echo "Deploy target verified as current main: $TARGET_SHA"

      - name: Require immutable GHCR publication proof
        shell: bash
        run: |
          set -euo pipefail
          statuses="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA?per_page=100")"
          state="$(printf '%s' "$statuses" | jq -r '[.[] | select(.context == "ghcr/published")][0].state // "missing"')"
          if [[ "$state" != "success" ]]; then
            echo "Refusing deploy: ghcr/published is '$state' for $TARGET_SHA." >&2
            exit 1
          fi
          echo "Immutable production images verified for $TARGET_SHA."

      - name: Pin Coolify IMAGE_TAG to exact published SHA
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg sha "$TARGET_SHA" '{key:"IMAGE_TAG", value:$sha, is_preview:false, is_literal:true}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/applications/$COOLIFY_APP_UUID/envs" >/dev/null
          echo "Coolify IMAGE_TAG pinned to the verified main SHA."

      - name: Trigger only the production application deployment
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg uuid "$COOLIFY_APP_UUID" '{uuid:$uuid}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/deploy")"
          deployment_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')"
          resource_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].resource_uuid // empty')"
          if [[ -z "$deployment_uuid" ]]; then
            echo "Coolify did not return a deployment UUID." >&2
            exit 1
          fi
          if [[ "$resource_uuid" != "$COOLIFY_APP_UUID" ]]; then
            echo "Coolify returned an unexpected resource UUID." >&2
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Deployment queued for the bounded production resource."

      - name: Verify deployment reaches terminal success
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          deployment_uuid="${{ steps.trigger.outputs.deployment_uuid }}"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              "$base/api/v1/deployments/$deployment_uuid")"
            status="$(printf '%s' "$response" | jq -r '.status // "unknown"')"
            case "$status" in
              finished|success|succeeded|completed)
                echo "Coolify deployment succeeded for $TARGET_SHA."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "Coolify deployment ended with status '$status'." >&2
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "Coolify deployment did not reach a recognized terminal state before timeout." >&2
          exit 1

name: Coolify stack validation

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.web
      - docker-compose.coolify.yml
      - deploy/**
      - .dockerignore
      - artifacts/api-server/**
      - artifacts/ai-edge-solutions/**
      - lib/**
      - docs/**
      - AGENTS.md
      - ROADMAP.md
      - CHANGELOG.md
      - SESSION_HANDOFF.md
      - replit.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/coolify-stack-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_edge_coolify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_edge_coolify_ci
      CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      SCHEDULER_SECRET: ci-only-not-production
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci
      VITE_CLERK_PROXY_URL: ""
      SCHEDULER_ENABLED: "false"
      REFERRAL_SCHEDULER_ENABLED: "false"
      AI_VISIBILITY_SCHEDULER_ENABLED: "false"
      REFERRAL_DELIVERY_ENABLED: "false"
      REFERRAL_DELIVERY_MODE: dry_run
      REFERRAL_DELIVERY_EMERGENCY_STOP: "true"
      GORILLADESK_API_KEY: ci-only-not-production
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/scheduler-enabled.test.ts src/__tests__/dab-planner-worker-config.test.ts src/__tests__/dab-runtime-status.test.ts src/__tests__/apollos-capabilities.test.ts src/__tests__/dab-agent-worker-config.test.ts src/__tests__/dab-trusted-context.test.ts src/__tests__/dab-approval-policy.test.ts src/__tests__/dab-preparation-policy.test.ts src/__tests__/dab-publishing-policy.test.ts
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/ai-edge-solutions run build
      - name: Validate Compose rendering
        run: docker compose -f docker-compose.coolify.yml config >/tmp/coolify-compose.yml
      - name: Build production images
        run: docker compose -f docker-compose.coolify.yml build
      - name: Apollos core runtime preflight
        run: |
          api_image="$(docker compose -f docker-compose.coolify.yml images -q api)"
          test -n "$api_image"
          docker run --rm \
            --entrypoint sh \
            -e NODE_ENV=test \
            -e LOCAL_MEDIA_DIR=/tmp/apollos-media \
            -e SCHEDULER_ENABLED=false \
            -e REFERRAL_DELIVERY_EMERGENCY_STOP=true \
            "$api_image" /app/deploy/smoke/apollos-core-runtime.sh
      - name: Apollos media runtime preflight
        run: |
          api_image="$(docker compose -f docker-compose.coolify.yml images -q api)"
          test -n "$api_image"
          docker run --rm --entrypoint sh "$api_image" /app/deploy/smoke/apollos-media-runtime.sh
      - run: git diff --check

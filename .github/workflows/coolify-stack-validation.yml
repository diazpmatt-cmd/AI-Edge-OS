name: Coolify stack validation

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.web
      - Dockerfile.dab-git-worker
      - docker-compose.coolify.yml
      - docker-compose.prebuilt.yml
      - deploy/**
      - .dockerignore
      - artifacts/api-server/**
      - artifacts/ai-edge-solutions/**
      - lib/**
      - docs/**
      - AGENTS.md
      - ROADMAP.md
      - CHANGELOG.md
      - SESSION_HANDOFF.md
      - replit.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/coolify-stack-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_edge_coolify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      COMPOSE_PROJECT_NAME: ai-edge-os
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_edge_coolify_ci
      CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      SCHEDULER_SECRET: ci-only-not-production
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci
      VITE_CLERK_PROXY_URL: ""
      SCHEDULER_ENABLED: "false"
      REFERRAL_SCHEDULER_ENABLED: "false"
      AI_VISIBILITY_SCHEDULER_ENABLED: "false"
      REFERRAL_DELIVERY_ENABLED: "false"
      REFERRAL_DELIVERY_MODE: dry_run
      REFERRAL_DELIVERY_EMERGENCY_STOP: "true"
      GORILLADESK_API_KEY: ci-only-not-production
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - name: Test canonical Clerk production proxy behavior
        working-directory: artifacts/api-server
        run: pnpm exec vitest run src/middlewares/clerkProxyMiddleware.test.ts
      - run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/scheduler-enabled.test.ts src/__tests__/dab-planner-worker-config.test.ts src/__tests__/dab-runtime-status.test.ts src/__tests__/apollos-capabilities.test.ts src/__tests__/apollos-weekly-campaign.test.ts src/__tests__/apollos-weekly-approval.test.ts src/__tests__/apollos-weekly-execution.test.ts src/__tests__/apollos-diagnostics.test.ts src/__tests__/apollos-repair-planner.test.ts src/__tests__/apollos-repair-approval.test.ts src/__tests__/apollos-repair-execution.test.ts src/__tests__/apollos-repair-runner.test.ts src/__tests__/apollos-repair-worker-config.test.ts src/__tests__/apollos-repair-adapters.test.ts src/__tests__/apollos-repair-adapter-status.test.ts src/__tests__/apollos-upstream-probe.test.ts src/__tests__/dab-agent-worker-config.test.ts src/__tests__/dab-trusted-context.test.ts src/__tests__/dab-approval-policy.test.ts src/__tests__/dab-preparation-policy.test.ts src/__tests__/dab-git-apply-policy.test.ts src/__tests__/dab-git-apply-handler.test.ts src/__tests__/dab-git-commit-handler.test.ts src/__tests__/dab-git-push-pr-handler.test.ts src/__tests__/dab-ci-reconciliation.test.ts src/__tests__/dab-git-merge-handler.test.ts src/__tests__/dab-engineering-milestone-recorder.test.ts src/__tests__/dab-post-merge-verification.test.ts src/__tests__/dab-autonomous-engineering-chain.test.ts src/__tests__/dab-git-worker-config.test.ts src/__tests__/dab-github-transport-adapter.test.ts src/__tests__/dab-publishing-policy.test.ts src/lib/apollos-client-access-policy.test.ts src/lib/apollos-client-mcp-auth.test.ts src/lib/apollos-client-mcp-handler.test.ts src/lib/apollos-weekly-publishing-health.test.ts src/lib/apollos-weekly-publishing-health-handler.test.ts src/lib/apollos-client-mcp.test.ts src/lib/apollos-client-mcp-access-level.test.ts src/lib/backlink-opportunity-intelligence.test.ts src/lib/backlink-workflow-human-action.test.ts src/lib/backlink-workflow-patch.test.ts src/lib/authority-outreach-draft.test.ts src/lib/authority-outreach-draft-lifecycle.test.ts src/lib/authority-outreach-draft-store.integration.test.ts src/lib/authority-target-contact-lifecycle.test.ts src/lib/authority-target-contact-store.integration.test.ts src/lib/authority-outreach-readiness.test.ts src/lib/backlink-workflow-win-evidence-policy.test.ts src/lib/authority-backlink-win-evidence-store.integration.test.ts src/lib/competitive-edge-read-model.test.ts src/lib/competitive-edge-mcp.test.ts
      - name: Test Apollos control-plane behavior
        working-directory: artifacts/api-server
        run: |
          pnpm exec vitest run \
            src/lib/apollos-admin-access-policy.test.ts \
            src/lib/apollos-github-mcp-extension.test.ts \
            src/lib/apollos-github-readonly.test.ts \
            src/lib/apollos-coolify-mcp-extension.test.ts \
            src/lib/apollos-coolify-readonly.test.ts \
            src/lib/apollos-clerk-instance-diagnostics-mcp.test.ts \
            src/lib/apollos-clerk-instance-diagnostics.test.ts \
            src/lib/apollos-control-plane-mcp.test.ts \
            src/lib/apollos-postgres-readonly.test.ts \
            src/lib/apollos-runtime-readiness.test.ts \
            src/lib/apollos-runtime-version.test.ts \
            src/lib/apollos-system-diagnostic-mcp.test.ts \
            src/lib/apollos-system-diagnostic.test.ts \
            src/lib/apollos-system-repair-proposal-mcp.test.ts \
            src/lib/apollos-system-repair-proposal.test.ts
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/ai-edge-solutions run build
      - name: Validate Compose rendering
        run: docker compose -f docker-compose.coolify.yml config >/tmp/coolify-compose.yml
      - name: Validate production Nginx config
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Build production images
        run: docker compose -f docker-compose.coolify.yml build
      - name: Apollos core runtime preflight
        run: |
          runtime_image="ai-edge-os-runtime:${SOURCE_COMMIT:-latest}"
          api_image="$(docker image inspect --format '{{.Id}}' "$runtime_image" 2>/dev/null)" || {
            printf 'APOLLOS_CORE_PREFLIGHT_FAILED code=APOLLOS_API_IMAGE_RESOLUTION_FAILED message=%s\n' "Shared runtime image $runtime_image is unavailable" >&2
            exit 1
          }
          if [ -z "$api_image" ]; then
            printf 'APOLLOS_CORE_PREFLIGHT_FAILED code=APOLLOS_API_IMAGE_RESOLUTION_EMPTY message=%s\n' "Resolved shared runtime image ID for $runtime_image is empty" >&2
            exit 1
          fi
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,src="$PWD/deploy/smoke",dst=/smoke,readonly \
            -e NODE_ENV=test \
            -e LOCAL_MEDIA_DIR=/tmp/apollos-media \
            -e SCHEDULER_ENABLED=false \
            -e REFERRAL_DELIVERY_EMERGENCY_STOP=true \
            "$api_image" -c '
              set -eu
              if [ ! -r /smoke/apollos-core-runtime.sh ]; then
                printf "APOLLOS_CORE_PREFLIGHT_FAILED code=APOLLOS_SMOKE_SCRIPT_UNREADABLE message=%s\n" "Mounted core smoke script is not readable" >&2
                exit 1
              fi
              printf "APOLLOS_CORE_HARNESS_READY image_runtime=%s script=%s\n" "$(node --version 2>/dev/null || printf unavailable)" "/smoke/apollos-core-runtime.sh"
              exec sh /smoke/apollos-core-runtime.sh
            '
      - name: Apollos media runtime preflight
        run: |
          runtime_image="ai-edge-os-runtime:${SOURCE_COMMIT:-latest}"
          api_image="$(docker image inspect --format '{{.Id}}' "$runtime_image" 2>/dev/null)" || {
            printf 'APOLLOS_MEDIA_PREFLIGHT_FAILED code=APOLLOS_API_IMAGE_RESOLUTION_FAILED message=%s\n' "Shared runtime image $runtime_image is unavailable" >&2
            exit 1
          }
          if [ -z "$api_image" ]; then
            printf 'APOLLOS_MEDIA_PREFLIGHT_FAILED code=APOLLOS_API_IMAGE_RESOLUTION_EMPTY message=%s\n' "Resolved shared runtime image ID for $runtime_image is empty" >&2
            exit 1
          fi
          docker run --rm \
            --entrypoint sh \
            --mount type=bind,src="$PWD/deploy/smoke",dst=/smoke,readonly \
            "$api_image" -c '
              set -eu
              if [ ! -r /smoke/apollos-media-runtime.sh ]; then
                printf "APOLLOS_MEDIA_PREFLIGHT_FAILED code=APOLLOS_SMOKE_SCRIPT_UNREADABLE message=%s\n" "Mounted media smoke script is not readable" >&2
                exit 1
              fi
              printf "APOLLOS_MEDIA_HARNESS_READY script=%s\n" "/smoke/apollos-media-runtime.sh"
              exec sh /smoke/apollos-media-runtime.sh
            '
      - run: git diff --check

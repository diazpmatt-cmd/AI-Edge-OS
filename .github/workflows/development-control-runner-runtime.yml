name: Development Control Runner Runtime Verification

on:
  pull_request:
    paths:
      - "lib/development-control-runner-runtime/**"
      - "lib/development-control-runner/**"
      - ".github/workflows/development-control-runner-runtime.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/development-control-runner-runtime typecheck
      - run: pnpm --filter @workspace/development-control-runner-runtime test
      - run: pnpm --filter @workspace/development-control-runner typecheck
      - run: pnpm --filter @workspace/development-control-runner test
      - run: git diff --check

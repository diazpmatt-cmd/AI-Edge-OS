name: Development Control Runner Verification

on:
  pull_request:
    paths:
      - "lib/development-control-runner/**"
      - ".github/workflows/development-control-runner.yml"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/development-control-runner typecheck
      - run: pnpm --filter @workspace/development-control-runner test
      - run: git diff --check

name: Development Control Runner Verification

on:
  pull_request:
    paths:
      - "lib/development-control-runner/**"
      - ".github/workflows/development-control-runner.yml"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/development-control-runner typecheck
      - run: pnpm --filter @workspace/development-control-runner test
      - run: git diff --check

  inspect-production-deployments:
    if: github.head_ref == 'diag/prod-auth-live-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || secrets.COOLIFY_BASE_URL }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      COOLIFY_APP_UUID: a6y7jyyedbgfwvlh7vag7xh8
    steps:
      - name: Inspect sanitized deployment history
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COOLIFY_BASE_URL:-}"
          test -n "${COOLIFY_DEPLOY_TOKEN:-}"
          base="${COOLIFY_BASE_URL%/}"
          history="$(mktemp)"
          all="$(mktemp)"
          trap 'rm -f "$history" "$all"' EXIT

          set +e
          curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Accept: application/json" \
            "$base/api/v1/deployments/applications/$COOLIFY_APP_UUID" \
            -o "$history"
          history_rc=$?
          set -e
          echo "app_deployment_history_curl_exit=$history_rc"
          if [ "$history_rc" -eq 0 ]; then
            echo "app_deployment_history_type=$(jq -r 'type' "$history" 2>/dev/null || echo invalid)"
            echo "app_deployment_history_count=$(jq -r 'if type=="array" then length else 0 end' "$history" 2>/dev/null || echo 0)"
            jq -r '
              if type=="array" then
                sort_by(.created_at // "") | reverse | .[:12][] |
                [
                  (.deployment_uuid // .uuid // "unknown"),
                  (.status // "unknown"),
                  ((.is_webhook // false)|tostring),
                  ((.is_api // false)|tostring),
                  ((.rollback // false)|tostring),
                  (.created_at // "unknown"),
                  (.updated_at // "unknown"),
                  ((.logs // "")|tostring|length|tostring)
                ] | @tsv
              else empty end
            ' "$history" | while IFS=$'\t' read -r uuid status webhook api rollback created updated logbytes; do
              echo "deployment uuid=$uuid status=$status webhook=$webhook api=$api rollback=$rollback created=$created updated=$updated log_bytes=$logbytes"
            done

            jq -r 'if type=="array" then .[] | select((.logs // "") != "") | (.logs|tostring) else empty end' "$history" > "$all"
          fi

          if [ ! -s "$all" ]; then
            set +e
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
              -H "Accept: application/json" \
              "$base/api/v1/deployments" \
              -o "$history"
            all_rc=$?
            set -e
            echo "all_deployments_curl_exit=$all_rc"
            if [ "$all_rc" -eq 0 ]; then
              echo "all_deployments_type=$(jq -r 'type' "$history" 2>/dev/null || echo invalid)"
              echo "all_deployments_count=$(jq -r 'if type=="array" then length else 0 end' "$history" 2>/dev/null || echo 0)"
              jq -r 'if type=="array" then .[] | select((.logs // "") != "") | (.logs|tostring) else empty end' "$history" > "$all"
            fi
          fi

          count() {
            local label="$1" pattern="$2"
            echo "${label}=$(grep -Eic "$pattern" "$all" || true)"
          }

          echo "sanitized_deployment_log_bytes=$(wc -c < "$all" | tr -d ' ')"
          count "nginx_emerg_count" 'nginx: \[emerg\]|emerg'
          count "network_not_found_count" 'network .* not found|network.*does not exist'
          count "service_unhealthy_count" 'unhealthy|health check failed|healthcheck failed'
          count "container_exit_count" 'exited with code|exit code|container.*exited'
          count "api_start_failure_count" 'Startup migration or publishing guard failed|Error listening on port'
          count "required_config_count" 'required but was not provided|is required'
          count "name_resolution_count" 'host not found|could not be resolved|name or service not known|temporary failure in name resolution|EAI_AGAIN|ENOTFOUND'
          count "connection_count" 'connect\(\) failed|connection refused|ECONNREFUSED|No route to host|Network is unreachable'
          count "compose_error_count" 'compose.*error|service .* failed|failed to start|failed to create'
          count "port_conflict_count" 'address already in use|port is already allocated'
          count "pull_error_count" 'pull access denied|manifest unknown|not found.*manifest|unauthorized'
          count "oom_count" 'out of memory|oom|killed process'
          count "bind_mount_count" 'bind source path does not exist|invalid mount config|mount.*failed|not a directory'
          count "health_dependency_count" 'dependency failed to start|depends_on|service_healthy'

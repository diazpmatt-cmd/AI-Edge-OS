name: Development Control Runner Verification

on:
  pull_request:
    paths:
      - "lib/development-control-runner/**"
      - ".github/workflows/development-control-runner.yml"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/development-control-runner typecheck
      - run: pnpm --filter @workspace/development-control-runner test
      - run: git diff --check

  resume-production:
    if: github.head_ref == 'diag/prod-auth-live-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || secrets.COOLIFY_BASE_URL }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      COOLIFY_APP_UUID: a6y7jyyedbgfwvlh7vag7xh8
      DATABASE_UUID: ypg0krkeij7h7u9inur0aq9e
      RECOVERY_SHA: 4c8cf8ecb9000a5d172c16e31477abd3a240e425
    steps:
      - name: Require PostgreSQL healthy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COOLIFY_BASE_URL:-}"
          test -n "${COOLIFY_DEPLOY_TOKEN:-}"
          base="${COOLIFY_BASE_URL%/}"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Accept: application/json" \
            "$base/api/v1/databases/$DATABASE_UUID")"
          status="$(printf '%s' "$response" | jq -r '.status // "unknown"')"
          echo "database_state=$status"
          test "$status" = "running:healthy"

      - name: Verify and pin known-good images
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker buildx imagetools inspect "ghcr.io/diazpmatt-cmd/ai-edge-os-runtime:${RECOVERY_SHA}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/diazpmatt-cmd/ai-edge-os-web:${RECOVERY_SHA}" >/dev/null
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg sha "$RECOVERY_SHA" '{key:"IMAGE_TAG", value:$sha, is_preview:false, is_literal:true}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/applications/$COOLIFY_APP_UUID/envs" >/dev/null
          echo "Known-good image tag verified and pinned."

      - name: Deploy canonical API and web stack once
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg uuid "$COOLIFY_APP_UUID" '{uuid:$uuid}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/deploy")"
          deployment_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')"
          test -n "$deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Canonical lean recovery deployment queued."

      - name: Require terminal Coolify success
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          deployment_uuid="${{ steps.deploy.outputs.deployment_uuid }}"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
              "$base/api/v1/deployments/$deployment_uuid")"
            status="$(printf '%s' "$response" | jq -r '.status // "unknown"')"
            case "$status" in
              finished|success|succeeded|completed)
                echo "Canonical lean recovery deployment succeeded."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "Canonical lean recovery ended with status '$status'." >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
          echo "Canonical lean recovery timed out." >&2
          exit 1

      - name: Verify public site and API recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            home="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://aiedgesolutions.online/ || true)"
            api="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://aiedgesolutions.online/api/healthz || true)"
            echo "public_probe home=$home api_health=$api"
            if [ "$home" = "200" ] && [ "$api" = "200" ]; then
              echo "Canonical production recovered end-to-end."
              exit 0
            fi
            sleep 10
          done
          echo "Canonical production did not recover end-to-end." >&2
          exit 1

name: Development Control Runner Verification

on:
  pull_request:
    paths:
      - "lib/development-control-runner/**"
      - ".github/workflows/development-control-runner.yml"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/development-control-runner typecheck
      - run: pnpm --filter @workspace/development-control-runner test
      - run: git diff --check

  emergency-production-recovery:
    if: github.head_ref == 'diag/prod-auth-live-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || secrets.COOLIFY_BASE_URL }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      COOLIFY_APP_UUID: a6y7jyyedbgfwvlh7vag7xh8
      ROLLBACK_SHA: 4c8cf8ecb9000a5d172c16e31477abd3a240e425
    steps:
      - name: Validate recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "${COOLIFY_BASE_URL:-}"
          test -n "${COOLIFY_DEPLOY_TOKEN:-}"
          echo "Recovery inputs present."

      - name: Verify exact immutable rollback images exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker buildx imagetools inspect "ghcr.io/diazpmatt-cmd/ai-edge-os-runtime:${ROLLBACK_SHA}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/diazpmatt-cmd/ai-edge-os-web:${ROLLBACK_SHA}" >/dev/null
          echo "Exact rollback images verified."

      - name: Restore canonical app image tag
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg sha "$ROLLBACK_SHA" '{key:"IMAGE_TAG", value:$sha, is_preview:false, is_literal:true}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/applications/$COOLIFY_APP_UUID/envs" >/dev/null
          echo "Canonical app pinned to verified rollback SHA."

      - name: Deploy only canonical application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg uuid "$COOLIFY_APP_UUID" '{uuid:$uuid}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/deploy")"
          deployment_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')"
          resource_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].resource_uuid // empty')"
          test -n "$deployment_uuid"
          test "$resource_uuid" = "$COOLIFY_APP_UUID"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Recovery deployment queued."

      - name: Require terminal Coolify success
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          deployment_uuid="${{ steps.deploy.outputs.deployment_uuid }}"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
              "$base/api/v1/deployments/$deployment_uuid")"
            status="$(printf '%s' "$response" | jq -r '.status // "unknown"')"
            case "$status" in
              finished|success|succeeded|completed)
                echo "Recovery deployment succeeded."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "Recovery deployment ended with status '$status'." >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
          echo "Recovery deployment timed out." >&2
          exit 1

      - name: Verify public site recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://aiedgesolutions.online/ || true)"
            if [ "$status" = "200" ]; then
              echo "Canonical website recovered with HTTP 200."
              exit 0
            fi
            sleep 10
          done
          echo "Canonical website did not recover to HTTP 200." >&2
          exit 1

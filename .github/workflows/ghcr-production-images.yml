name: GHCR production images

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.dab-git-worker
      - Dockerfile.web
      - docker-compose.prebuilt.yml
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - artifacts/**
      - lib/**
      - deploy/**
      - .github/workflows/ghcr-production-images.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.dab-git-worker
      - Dockerfile.web
      - docker-compose.prebuilt.yml
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - artifacts/**
      - lib/**
      - deploy/**
      - .github/workflows/ghcr-production-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: ghcr-production-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  RUNTIME_IMAGE: ghcr.io/diazpmatt-cmd/ai-edge-os-runtime
  GIT_WORKER_IMAGE: ghcr.io/diazpmatt-cmd/ai-edge-os-git-worker
  WEB_IMAGE: ghcr.io/diazpmatt-cmd/ai-edge-os-web

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Render and prove pull-only production compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
          CLERK_PUBLISHABLE_KEY: pk_test_validation
          CLERK_SECRET_KEY: sk_test_validation
          SCHEDULER_SECRET: validation-only
          GORILLADESK_API_KEY: validation-only
        run: |
          docker compose -f docker-compose.prebuilt.yml config > /tmp/prebuilt-compose.yml
          if grep -Eq '^[[:space:]]+build:' /tmp/prebuilt-compose.yml; then
            echo 'Prebuilt compose still contains local build instructions.' >&2
            cat /tmp/prebuilt-compose.yml
            exit 1
          fi
          image_count=$(grep -Ec '^[[:space:]]+image: ghcr\.io/diazpmatt-cmd/ai-edge-os-' /tmp/prebuilt-compose.yml)
          if [ "$image_count" -ne 9 ]; then
            echo "Expected 9 GHCR-backed services, found $image_count." >&2
            cat /tmp/prebuilt-compose.yml
            exit 1
          fi

  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build shared API/runtime image off production
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.RUNTIME_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  build-git-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build DAB Git worker image off production
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: Dockerfile.dab-git-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.GIT_WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=git-worker
          cache-to: type=gha,mode=max,scope=git-worker

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require web build configuration on publish
        if: github.event_name != 'pull_request'
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: test -n "$VITE_CLERK_PUBLISHABLE_KEY"
      - name: Build web image off production
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_CLERK_PROXY_URL=${{ secrets.VITE_CLERK_PROXY_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  verify-published-images:
    if: github.event_name != 'pull_request'
    needs: [validate-compose, build-runtime, build-git-worker, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable production image tags exist
        run: |
          set -eu
          for image in "$RUNTIME_IMAGE" "$GIT_WORKER_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools inspect "$image:$GITHUB_SHA" >/dev/null
          done
      - name: Publish GHCR verification commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"ghcr/published","description":"Immutable production images verified in GHCR"}'

  verify-current-main-images:
    if: github.event_name == 'pull_request'
    needs: [validate-compose, build-runtime, build-git-worker, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR for current-main probe
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify current main immutable images exist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          for image in "$RUNTIME_IMAGE" "$GIT_WORKER_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools inspect "$image:$BASE_SHA" >/dev/null
          done

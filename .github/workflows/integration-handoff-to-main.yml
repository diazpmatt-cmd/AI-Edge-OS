name: Handoff to main integration

on:
  push:
    branches:
      - integration/handoff-to-main-rge-v1-2026-07-25
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_edge_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_edge_integration
      NODE_ENV: test
      REFERRAL_DELIVERY_ENABLED: "false"
      REFERRAL_DELIVERY_MODE: dry_run
      REFERRAL_DELIVERY_EMERGENCY_STOP: "true"
      REFERRAL_SCHEDULER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      SCHEDULER_SECRET: integration-test-only-not-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/handoff-to-main-rge-v1-2026-07-25

      - name: Verify starting heads
        run: |
          set -euo pipefail
          git fetch origin main handoff/gbp-location-final-2026-07-24
          test "$(git rev-parse origin/main)" = "b5c2738bc62854570cb168db00c769801b931382"
          test "$(git rev-parse origin/handoff/gbp-location-final-2026-07-24)" = "664e945148f58c720be311cb71db0ad7efc25f3c"

      - name: Attempt merge without commit
        id: merge
        shell: bash
        run: |
          set +e
          git config user.name "AI Edge Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          if git merge-base --is-ancestor origin/handoff/gbp-location-final-2026-07-24 HEAD; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-commit --no-ff origin/handoff/gbp-location-final-2026-07-24
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo "# Integration conflict report"
              echo
              echo "Base: $(git rev-parse HEAD)"
              echo "Handoff: $(git rev-parse origin/handoff/gbp-location-final-2026-07-24)"
              echo
              echo "## Unmerged files"
              git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/'
              echo
              echo "## Conflict summary"
              git status --short
            } > integration-conflicts.md
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "conflicted=false" >> "$GITHUB_OUTPUT"

      - name: Upload conflict report
        if: failure() && hashFiles('integration-conflicts.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-conflicts
          path: integration-conflicts.md

      - name: Setup pnpm
        if: steps.merge.outputs.conflicted == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        if: steps.merge.outputs.conflicted == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.conflicted == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build workspace TypeScript libraries
        if: steps.merge.outputs.conflicted == 'false'
        run: pnpm run typecheck:libs

      - name: Bootstrap fresh database and verify migrations twice
        if: steps.merge.outputs.conflicted == 'false'
        shell: bash
        run: |
          set -euo pipefail
          migration_test="artifacts/api-server/src/__tests__/.integration-fresh-database.test.ts"
          trap 'rm -f "$migration_test"' EXIT
          cat > "$migration_test" <<'EOF'
          import { afterAll, describe, expect, it } from "vitest";
          import { readFile, readdir } from "node:fs/promises";
          import { resolve } from "node:path";
          import { pool } from "@workspace/db";
          import { migrateSchema } from "../lib/schema-migrate.js";

          const migrationDirectory = resolve(process.cwd(), "../../lib/db/migrations");
          const referralTables = [
            "referral_programs",
            "referrals",
            "referral_invitation_templates",
            "referral_invitations",
            "referral_contact_preferences",
            "referral_delivery_attempts",
            "referral_reward_ledger",
            "referral_fraud_reviews",
            "referral_fraud_review_events",
            "referral_crm_attributions",
          ];

          async function applySqlMigrations(): Promise<void> {
            const files = (await readdir(migrationDirectory))
              .filter((file) => file.endsWith(".sql"))
              .sort();
            for (const file of files) {
              const sql = await readFile(resolve(migrationDirectory, file), "utf8");
              const client = await pool.connect();
              try {
                await client.query("BEGIN");
                await client.query(sql);
                await client.query("COMMIT");
              } catch (error) {
                await client.query("ROLLBACK");
                throw new Error(`Migration ${file} failed`, { cause: error });
              } finally {
                client.release();
              }
            }
          }

          async function waitForReferralTables(): Promise<string[]> {
            for (let attempt = 0; attempt < 50; attempt += 1) {
              const result = await pool.query<{ table_name: string }>(
                `SELECT table_name
                   FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_name = ANY($1::text[])
                  ORDER BY table_name`,
                [referralTables],
              );
              if (result.rows.length === referralTables.length) {
                return result.rows.map((row) => row.table_name);
              }
              await new Promise((resolveWait) => setTimeout(resolveWait, 100));
            }
            return [];
          }

          describe("fresh PostgreSQL migration chain", () => {
            it("applies the production bootstrap and SQL migrations twice", async () => {
              await migrateSchema();
              await applySqlMigrations();
              await migrateSchema();
              await applySqlMigrations();

              await import("../routes/referrals.js");
              const actualTables = await waitForReferralTables();
              expect(actualTables).toEqual([...referralTables].sort());
            });
          });

          afterAll(async () => {
            await pool.end();
          });
          EOF
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/.integration-fresh-database.test.ts

      - name: Validate
        if: steps.merge.outputs.conflicted == 'false'
        run: |
          set -euo pipefail
          pnpm exec tsc -p lib/db/tsconfig.json --noEmit
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/ai-edge-solutions run typecheck
          pnpm --filter @workspace/api-server test
          pnpm --filter @workspace/ai-edge-solutions test
          pnpm --filter @workspace/api-server run build
          pnpm --filter @workspace/ai-edge-solutions run build
          git diff --check

      - name: Commit and push merge
        if: steps.merge.outputs.conflicted == 'false' && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Handoff is already integrated; no merge commit is required."
            exit 0
          fi
          git commit -m "Merge handoff branch into main integration"
          git push origin HEAD:integration/handoff-to-main-rge-v1-2026-07-25

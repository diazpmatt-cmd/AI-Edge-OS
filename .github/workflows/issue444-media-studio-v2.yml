name: Issue 444 Media Studio V2 patch

on:
  push:
    branches:
      - feat/444-media-studio-image-execution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/444-media-studio-image-execution
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable
      - name: Apply bounded patch
        run: python3 .github/scripts/issue444-media-studio-v2.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        run: pnpm --filter @workspace/ai-edge-solutions run build
      - name: Diff check
        run: git diff --check
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ai-edge-solutions/src/pages/MediaEnginePage.tsx
          if git diff --cached --quiet; then
            echo "No product patch required"
            exit 0
          fi
          git commit -m "feat: wire Media Studio to real image generation"
          git push origin HEAD:feat/444-media-studio-image-execution

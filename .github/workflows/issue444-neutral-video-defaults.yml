name: Issue 444 neutral video defaults

on:
  push:
    branches:
      - fix/444-neutral-video-studio-defaults

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/444-neutral-video-studio-defaults
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable
      - name: Apply tenant-neutral Video Studio defaults
        run: python3 .github/scripts/issue444-neutral-video-defaults.py
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @workspace/ai-edge-solutions run build
      - run: git diff --check
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ai-edge-solutions/src/pages/MediaEnginePage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make Video Studio defaults tenant-neutral"
          git push origin HEAD:fix/444-neutral-video-studio-defaults

# Verification workflow for Lead Intelligence review, sending, delivery, follow-up, conversion, revenue-leak detection, and production readiness.
name: Lead Intelligence CI

on:
  push:
    branches:
      - feature/lead-intelligence-v1
      - feature/lead-intelligence-send-v1
      - feature/lead-delivery-followup-v1
      - feature/lead-appointment-conversion-v1
      - feature/lead-production-readiness-v1
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/ai-edge-solutions/**"
      - "lib/db/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/lead-intelligence-ci.yml"

permissions:
  contents: read

concurrency:
  group: lead-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_intelligence_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck admin review queue
        run: pnpm --filter @workspace/ai-edge-solutions run typecheck

      - name: Run Lead Intelligence tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/__tests__/lead-intelligence-schema.test.ts
          src/__tests__/lead-intelligence-intake.test.ts
          src/__tests__/lead-intelligence-analysis.test.ts
          src/__tests__/lead-intelligence-route.test.ts
          src/__tests__/lead-intelligence-review.test.ts
          src/__tests__/lead-intelligence-send.test.ts
          src/__tests__/lead-intelligence-tenant-isolation.test.ts
          src/lib/marketplace-email-intake-parser.test.ts
          src/lib/marketplace-email-ingestion.test.ts
          src/__tests__/lead-email-gmail-client.test.ts
          src/__tests__/lead-email-worker-state.test.ts
          src/__tests__/lead-email-worker-safety.test.ts
          src/__tests__/lead-intelligence-delivery.test.ts
          src/__tests__/lead-intelligence-conversion.test.ts
          src/lib/web-leads-access-policy.test.ts
          src/lib/assessments-access-policy.test.ts
          src/routes/assessments.test.ts
          src/lib/revenue-leak-read-model.test.ts
          src/routes/revenue-leaks.test.ts
          src/lib/proof-pack-read-model.test.ts
          src/lib/attribution-payment-evidence.test.ts
          src/lib/gorilladesk-tenant-id-integrity.test.ts
          src/__tests__/gorilladesk-tenant-id-boundary.test.ts
          src/lib/revenue-attribution-matcher.test.ts
          src/__tests__/revenue-attribution-tenant-boundary.test.ts
          src/lib/customer-journey-event-store.test.ts
          src/lib/recovery-evidence.test.ts
          src/routes/proof-pack.test.ts
          src/routes/web-leads-mutation.test.ts
          src/__tests__/telnyx-webhook-security.test.ts

      - name: Run assessment inbox persistence test
        run: >-
          pnpm --filter @workspace/ai-edge-solutions exec vitest run
          src/pages/__tests__/AssessmentsInboxPage.test.tsx
          src/pages/__tests__/WebLeadsPage.test.tsx

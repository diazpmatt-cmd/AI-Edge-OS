name: MCP Coolify compose validation

on:
  pull_request:
    paths:
      - docker-compose.mcp.prebuilt.yml
      - .github/workflows/mcp-coolify-compose.yml
  push:
    branches: [main]
    paths:
      - docker-compose.mcp.prebuilt.yml
      - .github/workflows/mcp-coolify-compose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mcp-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove isolated MCP compose is pull-only and fail-closed
        env:
          MCP_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          docker compose -f docker-compose.mcp.prebuilt.yml config --format json > /tmp/mcp-compose-default.json
          docker compose --profile tunnel -f docker-compose.mcp.prebuilt.yml config --format json > /tmp/mcp-compose-tunnel.json
          python3 - <<'PY'
          import json

          with open('/tmp/mcp-compose-default.json', encoding='utf-8') as handle:
              default = json.load(handle)
          with open('/tmp/mcp-compose-tunnel.json', encoding='utf-8') as handle:
              tunneled = json.load(handle)

          default_services = default.get('services', {})
          if set(default_services) != {'mcp'}:
              raise SystemExit(f"default profile must contain only mcp, found {sorted(default_services)}")

          mcp = default_services['mcp']
          if 'build' in mcp:
              raise SystemExit('mcp compose must never build on the Coolify host')

          image = mcp.get('image', '')
          expected_prefix = 'ghcr.io/diazpmatt-cmd/ai-edge-os-mcp:'
          if not image.startswith(expected_prefix):
              raise SystemExit(f'unexpected MCP image: {image}')

          environment = mcp.get('environment', {})
          if environment.get('DAB3C_ENABLED') != 'false':
              raise SystemExit('DAB3C_ENABLED must default false')
          if environment.get('DAB3C_KILL_SWITCH') != 'true':
              raise SystemExit('DAB3C_KILL_SWITCH must default true')

          networks = mcp.get('networks', {})
          if 'coolify' not in networks:
              raise SystemExit('mcp must join the external coolify network')

          top_network = default.get('networks', {}).get('coolify', {})
          if top_network.get('external') is not True:
              raise SystemExit('coolify network must remain external')

          services = tunneled.get('services', {})
          if set(services) != {'mcp', 'tunnel-client'}:
              raise SystemExit(f"tunnel profile must contain mcp and tunnel-client, found {sorted(services)}")

          tunnel = services['tunnel-client']
          if 'build' in tunnel:
              raise SystemExit('tunnel-client must never build on the Coolify host')
          if tunnel.get('image') != 'ghcr.io/openai/tunnel-client:v0.0.11':
              raise SystemExit(f"unexpected tunnel-client image: {tunnel.get('image')}")
          tunnel_environment = tunnel.get('environment', {})
          if tunnel_environment.get('MCP_SERVER_URL') != 'http://mcp:3000/mcp':
              raise SystemExit('tunnel-client must reach MCP over the private Docker network')
          if 'coolify' not in tunnel.get('networks', {}):
              raise SystemExit('tunnel-client must join the external coolify network')
          PY

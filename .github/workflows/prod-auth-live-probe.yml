name: Production auth live probe

on:
  pull_request:
    paths:
      - .github/workflows/prod-auth-live-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe canonical production admin and Clerk proxy
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local label="$1"
            local url="$2"
            local body
            local headers
            body="$(mktemp)"
            headers="$(mktemp)"

            echo "=== ${label} ==="
            if ! curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --dump-header "$headers" --output "$body" \
              "$url"; then
              rc=$?
              status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
              echo "curl_exit=${rc}"
              echo "status=${status:-unavailable}"
              grep -iE '^(content-type|location|server|via|x-request-id):' "$headers" || true
              rm -f "$body" "$headers"
              return 1
            fi

            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"
            echo "status=${status:-unavailable}"
            grep -iE '^(content-type|location|server|via|x-request-id):' "$headers" || true
            echo "body_bytes=$(wc -c < "$body" | tr -d ' ')"
            rm -f "$body" "$headers"
          }

          probe "home" "https://aiedgesolutions.online/"
          probe "admin_login" "https://aiedgesolutions.online/admin/login"
          probe "admin_dashboard" "https://aiedgesolutions.online/admin/dashboard"
          probe "competitor_intelligence" "https://aiedgesolutions.online/admin/competitor-intelligence"
          probe "api_version" "https://aiedgesolutions.online/api/version"
          probe "clerk_environment" "https://aiedgesolutions.online/api/__clerk/v1/environment"

name: Production emergency rollback

on:
  pull_request:
    paths:
      - .github/workflows/prod-emergency-rollback.yml

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || secrets.COOLIFY_BASE_URL }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      COOLIFY_APP_UUID: a6y7jyyedbgfwvlh7vag7xh8
      ROLLBACK_SHA: 4c8cf8ecb9000a5d172c16e31477abd3a240e425
    steps:
      - name: Validate recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "${COOLIFY_BASE_URL:-}"
          test -n "${COOLIFY_DEPLOY_TOKEN:-}"
          echo "Recovery inputs present."

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact immutable rollback images exist
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/diazpmatt-cmd/ai-edge-os-runtime:${ROLLBACK_SHA}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/diazpmatt-cmd/ai-edge-os-web:${ROLLBACK_SHA}" >/dev/null
          echo "Exact rollback runtime and web images verified."

      - name: Pin canonical app to rollback SHA
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg sha "$ROLLBACK_SHA" '{key:"IMAGE_TAG", value:$sha, is_preview:false, is_literal:true}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/applications/$COOLIFY_APP_UUID/envs" >/dev/null
          echo "Canonical app image tag pinned to verified rollback SHA."

      - name: Trigger only canonical production application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          payload="$(jq -nc --arg uuid "$COOLIFY_APP_UUID" '{uuid:$uuid}')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$base/api/v1/deploy")"
          deployment_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')"
          resource_uuid="$(printf '%s' "$response" | jq -r '.deployments[0].resource_uuid // empty')"
          test -n "$deployment_uuid"
          test "$resource_uuid" = "$COOLIFY_APP_UUID"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Rollback deployment queued."

      - name: Require terminal Coolify success
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_BASE_URL%/}"
          deployment_uuid="${{ steps.deploy.outputs.deployment_uuid }}"
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
              "$base/api/v1/deployments/$deployment_uuid")"
            status="$(printf '%s' "$response" | jq -r '.status // "unknown"')"
            case "$status" in
              finished|success|succeeded|completed)
                echo "Rollback deployment succeeded."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "Rollback deployment ended with status '$status'." >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
          echo "Rollback did not reach a terminal state before timeout." >&2
          exit 1

      - name: Verify public recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            home_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://aiedgesolutions.online/ || true)"
            if [ "$home_status" = "200" ]; then
              echo "Canonical website recovered with HTTP 200."
              exit 0
            fi
            sleep 10
          done
          echo "Canonical website did not recover to HTTP 200." >&2
          exit 1

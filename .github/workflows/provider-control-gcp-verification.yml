name: Provider Control GCP Verification

on:
  pull_request:
    paths:
      - "lib/provider-control-gcp/**"
      - ".github/workflows/provider-control-gcp-verification.yml"
  push:
    branches: [main]
    paths:
      - "lib/provider-control-gcp/**"
      - ".github/workflows/provider-control-gcp-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/provider-control-gcp typecheck
      - run: pnpm --filter @workspace/provider-control-gcp test
      - run: git diff --check

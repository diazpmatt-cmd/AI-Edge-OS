name: Provider Control Verification

on:
  pull_request:
    paths:
      - "lib/provider-control/**"
      - ".github/workflows/provider-control-verification.yml"
  push:
    branches: [main]
    paths:
      - "lib/provider-control/**"
      - ".github/workflows/provider-control-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/provider-control typecheck
      - run: pnpm --filter @workspace/provider-control test

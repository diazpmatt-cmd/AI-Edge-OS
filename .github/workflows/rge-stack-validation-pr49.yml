name: RGE stacked PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rge-stack-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.number == 49
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_edge_rge_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_edge_rge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_edge_rge_ci
      PGPASSWORD: postgres
      AI_VISIBILITY_SCHEDULER_ENABLED: "false"
      DISCOVERY_SCHEDULER_ENABLED: "false"
      REFERRAL_DELIVERY_ENABLED: "false"
      REFERRAL_DELIVERY_MODE: dry_run
      REFERRAL_DELIVERY_EMERGENCY_STOP: "true"
      REFERRAL_DELIVERY_ALLOWLIST: ""
      STRIPE_SECRET_KEY: ""
      TELNYX_API_KEY: ""
      TELNYX_FROM_NUMBER: ""
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      GORILLADESK_API_KEY: ""
      OPENAI_API_KEY: ""
      AI_INTEGRATIONS_OPENAI_API_KEY: ""
      SCHEDULER_SECRET: ""

    steps:
      - name: Check out the stacked PR
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production migrations from scratch and verify idempotency
        shell: bash
        run: |
          set -euo pipefail
          migration_test="artifacts/api-server/src/__tests__/.rge-ci-fresh-database.test.ts"
          trap 'rm -f "$migration_test"' EXIT
          cat > "$migration_test" <<'EOF'
          import { afterAll, describe, expect, it } from "vitest";
          import { readFile, readdir } from "node:fs/promises";
          import { resolve } from "node:path";
          import { pool } from "@workspace/db";
          import { migrateSchema } from "../lib/schema-migrate.js";

          const migrationDirectory = resolve(process.cwd(), "../../lib/db/migrations");
          const referralTables = [
            "referral_programs",
            "referrals",
            "referral_invitation_templates",
            "referral_invitations",
            "referral_contact_preferences",
            "referral_delivery_attempts",
            "referral_reward_ledger",
            "referral_fraud_reviews",
            "referral_fraud_review_events",
            "referral_crm_attributions",
          ];

          async function applySqlMigrations(): Promise<void> {
            const files = (await readdir(migrationDirectory))
              .filter((file) => file.endsWith(".sql"))
              .sort();
            for (const file of files) {
              const sql = await readFile(resolve(migrationDirectory, file), "utf8");
              const client = await pool.connect();
              try {
                await client.query("BEGIN");
                await client.query(sql);
                await client.query("COMMIT");
              } catch (error) {
                await client.query("ROLLBACK");
                throw new Error(`Migration ${file} failed`, { cause: error });
              } finally {
                client.release();
              }
            }
          }

          async function waitForReferralTables(): Promise<string[]> {
            for (let attempt = 0; attempt < 50; attempt += 1) {
              const result = await pool.query<{ table_name: string }>(
                `SELECT table_name
                   FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_name = ANY($1::text[])
                  ORDER BY table_name`,
                [referralTables],
              );
              if (result.rows.length === referralTables.length) {
                return result.rows.map((row) => row.table_name);
              }
              await new Promise((resolveWait) => setTimeout(resolveWait, 100));
            }
            return [];
          }

          describe("fresh PostgreSQL migration chain", () => {
            it("applies the production bootstrap and SQL migrations twice", async () => {
              await migrateSchema();
              await applySqlMigrations();
              await migrateSchema();
              await applySqlMigrations();

              await import("../routes/referrals.js");
              const actualTables = await waitForReferralTables();
              expect(actualTables).toEqual([...referralTables].sort());
            });
          });

          afterAll(async () => {
            await pool.end();
          });
          EOF
          pnpm --filter @workspace/api-server exec vitest run \
            src/__tests__/.rge-ci-fresh-database.test.ts

      - name: Complete API test suite
        run: pnpm --filter @workspace/api-server test

      - name: Complete frontend test suite
        run: pnpm --filter @workspace/ai-edge-solutions test

      - name: Referral Growth aggregate tests
        shell: bash
        run: |
          mapfile -t api_tests < <(find artifacts/api-server/src/__tests__ -maxdepth 1 -name 'referral*.test.ts' -print | sort)
          mapfile -t ui_tests < <(find artifacts/ai-edge-solutions/src/lib/__tests__ -maxdepth 1 -name 'referral*.test.ts' -print | sort)
          pnpm --filter @workspace/api-server exec vitest run "${api_tests[@]#artifacts/api-server/}"
          pnpm --filter @workspace/ai-edge-solutions exec vitest run \
            --configLoader runner \
            --config vitest.config.ts \
            "${ui_tests[@]#artifacts/ai-edge-solutions/}"

      - name: Database TypeScript validation
        run: pnpm exec tsc -p lib/db/tsconfig.json --noEmit

      - name: API TypeScript validation
        run: pnpm --filter @workspace/api-server typecheck

      - name: Frontend TypeScript validation
        run: pnpm --filter @workspace/ai-edge-solutions typecheck

      - name: Production API build
        run: pnpm --filter @workspace/api-server build

      - name: Production frontend build
        run: pnpm --filter @workspace/ai-edge-solutions build

      - name: Diff whitespace validation
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Destroy disposable database
        if: always()
        shell: bash
        run: dropdb --if-exists --force --host=127.0.0.1 --username=postgres ai_edge_rge_ci

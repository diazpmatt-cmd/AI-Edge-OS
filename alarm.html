<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✅ Done — AI Edge Alarm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030612;
    color: #E2E8F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,174,239,0.15);
    animation: expand 3s ease-out infinite;
    pointer-events: none;
  }
  .ring:nth-child(1) { width: 200px; height: 200px; animation-delay: 0s; }
  .ring:nth-child(2) { width: 200px; height: 200px; animation-delay: 1s; }
  .ring:nth-child(3) { width: 200px; height: 200px; animation-delay: 2s; }

  @keyframes expand {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(4);   opacity: 0;   }
  }

  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 56px 60px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(0,174,239,0.07) 0%, rgba(0,174,239,0.02) 100%);
    border: 1.5px solid rgba(0,174,239,0.3);
    box-shadow: 0 0 60px rgba(0,174,239,0.1);
    max-width: 420px;
    width: 90vw;
  }

  .icon {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 8px rgba(0,174,239,0.4));  }
    50%       { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(0,174,239,0.8)); }
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #E2E8F0;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .sub {
    font-size: 14px;
    color: #475569;
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    border-radius: 14px;
    border: 1.5px solid rgba(0,174,239,0.6);
    background: linear-gradient(135deg, rgba(0,174,239,0.18) 0%, rgba(0,174,239,0.08) 100%);
    color: #00AEEF;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.2px;
  }
  .btn:hover {
    background: linear-gradient(135deg, rgba(0,174,239,0.28) 0%, rgba(0,174,239,0.14) 100%);
    box-shadow: 0 0 24px rgba(0,174,239,0.25);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }

  .status {
    margin-top: 20px;
    font-size: 12px;
    color: #334155;
    min-height: 18px;
    transition: color 0.3s;
  }
  .status.playing { color: #22C55E; }

  .badge {
    display: inline-block;
    margin-top: 28px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    background: rgba(0,174,239,0.08);
    border: 1px solid rgba(0,174,239,0.2);
    color: #00AEEF;
  }

  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin: 24px auto 0;
    height: 28px;
  }
  .bar {
    width: 4px;
    background: rgba(0,174,239,0.35);
    border-radius: 2px;
    animation: wave 1.2s ease-in-out infinite;
  }
  .bar:nth-child(1)  { height: 8px;  animation-delay: 0.0s; }
  .bar:nth-child(2)  { height: 16px; animation-delay: 0.1s; }
  .bar:nth-child(3)  { height: 22px; animation-delay: 0.2s; }
  .bar:nth-child(4)  { height: 28px; animation-delay: 0.3s; }
  .bar:nth-child(5)  { height: 22px; animation-delay: 0.4s; }
  .bar:nth-child(6)  { height: 16px; animation-delay: 0.5s; }
  .bar:nth-child(7)  { height: 10px; animation-delay: 0.6s; }
  .bar:nth-child(8)  { height: 18px; animation-delay: 0.7s; }
  .bar:nth-child(9)  { height: 24px; animation-delay: 0.8s; }
  .bar:nth-child(10) { height: 14px; animation-delay: 0.9s; }
  .bar:nth-child(11) { height: 8px;  animation-delay: 1.0s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); background: rgba(0,174,239,0.3); }
    50%       { transform: scaleY(1.0); background: rgba(0,174,239,0.7); }
  }
  .waveform.active .bar { animation-play-state: running; }
  .waveform:not(.active) .bar { animation-play-state: paused; opacity: 0.2; }
</style>
</head>
<body>

<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>

<div class="card">
  <span class="icon">✅</span>
  <h1>Checkpoint Reached</h1>
  <p class="sub">
    A task has been completed and committed.<br />
    Click below to hear your alarm.
  </p>

  <button class="btn" onclick="playAlarm()">
    🔔 Play Alarm
  </button>

  <div class="waveform" id="waveform">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>

  <p class="status" id="status">Click the button to play</p>
  <span class="badge">AI EDGE SOLUTIONS · COMMAND CENTER</span>
</div>

<script>
  let playing = false;

  // Pleasant ascending chime: C5 E5 G5 C6 — major chord arpeggio, 3 repeats
  const NOTES = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6

  function playChime(ctx, startTime) {
    NOTES.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      // Add a second harmonic for warmth
      const osc2  = ctx.createOscillator();
      const gain2 = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);

      osc.type  = "sine";
      osc2.type = "sine";
      osc.frequency.value  = freq;
      osc2.frequency.value = freq * 2; // octave harmonic

      const t = startTime + i * 0.32;

      // Primary note envelope
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.55, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);

      // Soft harmonic
      gain2.gain.setValueAtTime(0, t);
      gain2.gain.linearRampToValueAtTime(0.12, t + 0.04);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

      osc.start(t);  osc.stop(t + 0.6);
      osc2.start(t); osc2.stop(t + 0.5);
    });
  }

  function playAlarm() {
    if (playing) return;
    playing = true;

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const status   = document.getElementById("status");
    const waveform = document.getElementById("waveform");

    status.textContent = "🎵 Playing…";
    status.className   = "status playing";
    waveform.className = "waveform active";

    const repeatCount = 3;
    const gap = 1.8; // seconds between repeats
    const chimeDuration = NOTES.length * 0.32 + 0.6;

    for (let r = 0; r < repeatCount; r++) {
      playChime(ctx, ctx.currentTime + r * (chimeDuration + gap));
    }

    const totalDuration = (repeatCount * (chimeDuration + gap)) * 1000;
    setTimeout(() => {
      playing = false;
      status.textContent = "✓ Done — ready for next task";
      status.className   = "status";
      waveform.className = "waveform";
    }, totalDuration);
  }

  // Try autoplay on load (works if browser allows it)
  window.addEventListener("load", () => {
    try { playAlarm(); } catch(e) { /* blocked — user must click */ }
  });
</script>
</body>
</html>

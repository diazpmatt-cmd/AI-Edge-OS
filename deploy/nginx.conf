map $http_x_forwarded_proto $public_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 120m;

  # Docker service IPs can change when Coolify replaces/restarts the API
  # container. Resolve the service name at request time instead of pinning the
  # IP once when Nginx starts, otherwise the SPA stays healthy while every
  # /api/* request can be sent to a stale container address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /api/storage/uploads/direct {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
  }

  location /api/ {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $public_forwarded_proto;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

services:
  apollos-tunnel-client:
    image: ghcr.io/diazpmatt-cmd/ai-edge-os-mcp:tunnel-v0.0.11-ai-edge1
    restart: unless-stopped
    networks:
      - coolify
    environment:
      CONTROL_PLANE_API_KEY: ${APOLLOS_CONTROL_PLANE_API_KEY:?APOLLOS_CONTROL_PLANE_API_KEY is required}
      CONTROL_PLANE_TUNNEL_ID: ${APOLLOS_CONTROL_PLANE_TUNNEL_ID:?APOLLOS_CONTROL_PLANE_TUNNEL_ID is required}
      MCP_SERVER_URL: http://api:3000/api/apollos/mcp
      HARPOON_HOSTS_INCLUDE_SUFFIX: api
      HARPOON_ALLOW_PLAINTEXT_HTTP: "true"
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: ":8080"
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  coolify:
    external: true

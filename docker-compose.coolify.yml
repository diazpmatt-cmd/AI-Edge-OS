services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:?SCHEDULER_SECRET is required}
      GORILLADESK_API_KEY: ${GORILLADESK_API_KEY:?GORILLADESK_API_KEY is required}
      OBJECT_STORAGE_PROVIDER: gcs-wif
      PRIVATE_OBJECT_DIR: /ai-edge-os-media-prod-bbb-4827/private
      GOOGLE_CLOUD_PROJECT: project-4978b26c-b88e-454b-875
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp/workload-identity-credential.json
      GOOGLE_API_CERTIFICATE_CONFIG: /run/secrets/gcp/certificate-config.json
      SCHEDULER_ENABLED: "false"
      REFERRAL_SCHEDULER_ENABLED: "false"
      AI_VISIBILITY_SCHEDULER_ENABLED: "false"
      REFERRAL_DELIVERY_ENABLED: "false"
      REFERRAL_DELIVERY_MODE: dry_run
      REFERRAL_DELIVERY_EMERGENCY_STOP: "true"
      REFERRAL_DELIVERY_ALLOWLIST: ""
    volumes:
      - type: bind
        source: ./secrets/gcp/workload-identity-credential.json
        target: /run/secrets/gcp/workload-identity-credential.json
        read_only: true
      - type: bind
        source: ./secrets/gcp/certificate-config.json
        target: /run/secrets/gcp/certificate-config.json
        read_only: true
      - type: bind
        source: ./secrets/gcp/client-cert.pem
        target: /run/secrets/gcp/client-cert.pem
        read_only: true
      - type: bind
        source: ./secrets/gcp/client-key.pem
        target: /run/secrets/gcp/client-key.pem
        read_only: true
      - type: bind
        source: ./secrets/gcp/trust-chain.pem
        target: /run/secrets/gcp/trust-chain.pem
        read_only: true
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  dab-planner-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - node
      - --enable-source-maps
      - ./artifacts/api-server/dist/dab-planner-worker.mjs
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DAB_PLANNER_WORKER_ENABLED: "true"
      DAB_PLANNER_KILL_SWITCH: "false"
      DAB_PLANNER_RUNTIME_ID: dab-planner-production-1
      DAB_PLANNER_SCHEDULE_ID: dab-planner
      DAB_PLANNER_INTERVAL_MS: "60000"
      DAB_PLANNER_LEASE_MS: "120000"
      DAB_PLANNER_ACTIVATION_AUTHORIZATION_REF: github:diazpmatt-cmd/AI-Edge-OS/issues/94
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

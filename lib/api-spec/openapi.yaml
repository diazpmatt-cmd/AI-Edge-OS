openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Edge Solutions API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: diagnostics
    description: System diagnostics and integration health
  - name: keywords
    description: Keyword management
  - name: articles
    description: Article draft management
  - name: article-assets
    description: Article social assets
  - name: content-packages
    description: Content package management
  - name: content-assets
    description: Content asset management
  - name: agent-tasks
    description: Bounded autonomy approval layer — submit and review agent task requests
paths:
  /diagnostics/health-history:
    get:
      operationId: getDiagnosticsHealthHistory
      tags: [diagnostics]
      summary: Integration health check history
      description: >
        Returns persisted health-check records for the authenticated user.
        Records are written on every provider status change and at most once
        every 15 minutes as a heartbeat when state is unchanged.
        Results are ordered newest-first.
      parameters:
        - name: provider
          in: query
          required: false
          description: Filter to a single provider name (e.g. facebook, youtube)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (1–500, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Health history records newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationHealthHistoryResponse"
        "401":
          description: Unauthorized

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /keywords:
    get:
      operationId: listKeywords
      tags: [keywords]
      summary: List all keywords
      responses:
        "200":
          description: List of keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    post:
      operationId: createKeywords
      tags: [keywords]
      summary: Insert keywords in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordsBulkInput"
      responses:
        "201":
          description: Created keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    delete:
      operationId: clearKeywords
      tags: [keywords]
      summary: Delete all keywords
      responses:
        "204":
          description: Cleared

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List all article drafts
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleDraft"
    post:
      operationId: createArticles
      tags: [articles]
      summary: Insert article drafts in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticlesBulkInput"
      responses:
        "201":
          description: Created articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleDraft"
    delete:
      operationId: clearArticles
      tags: [articles]
      summary: Delete all articles for current user
      responses:
        "204":
          description: Cleared

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get single article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDraft"
        "404":
          description: Not found
    patch:
      operationId: updateArticle
      tags: [articles]
      summary: Update article draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDraft"

  /article-assets:
    get:
      operationId: listAllArticleAssets
      tags: [article-assets]
      summary: List all article assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleAsset"

  /article-assets/{articleId}:
    get:
      operationId: listArticleAssets
      tags: [article-assets]
      summary: List assets for an article
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleAsset"
    post:
      operationId: upsertArticleAssets
      tags: [article-assets]
      summary: Upsert article assets
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleAssetsBulkInput"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleAsset"

  /article-assets/item/{id}:
    patch:
      operationId: updateArticleAsset
      tags: [article-assets]
      summary: Update a single article asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleAssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleAsset"

  /ai/keywords:
    post:
      operationId: generateKeywords
      tags: [keywords]
      summary: AI-generate keyword ideas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordGenInput"
      responses:
        "200":
          description: Generated keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordGenResult"

  /ai/article:
    post:
      operationId: generateArticle
      tags: [articles]
      summary: AI-generate article content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleGenInput"
      responses:
        "200":
          description: Generated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleGenResult"

  /ai/article-assets:
    post:
      operationId: generateArticleAssets
      tags: [article-assets]
      summary: AI-generate social assets for an article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleAssetsGenInput"
      responses:
        "200":
          description: Generated assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleAssetsGenResult"

  /ai/repurpose:
    post:
      operationId: generateContentPackage
      tags: [content-packages]
      summary: AI-generate a full repurpose content package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepurposeInput"
      responses:
        "200":
          description: Generated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepurposeResult"

  /agent-tasks:
    post:
      operationId: submitAgentTask
      tags: [agent-tasks]
      summary: Submit a task for approval
      description: >
        Submits a task to the deterministic approval engine. Low-risk tasks
        (generate_content, schedule_post with valid payloads) are auto-approved
        immediately. High-stakes tasks (publish_post, update_* settings, pause/resume
        autopilot) are placed in pending_review for human decision. Invalid task
        types or malformed payloads are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskSubmit"
      responses:
        "201":
          description: Task created with engine decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "400":
          description: Invalid request body
        "401":
          description: Unauthorized
    get:
      operationId: listAgentTasks
      tags: [agent-tasks]
      summary: List agent tasks for the authenticated user
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by task status (pending_review, approved, rejected, executed, failed)
          schema:
            type: string
      responses:
        "200":
          description: List of agent tasks newest-first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskListResponse"
        "401":
          description: Unauthorized

  /agent-tasks/{id}:
    get:
      operationId: getAgentTask
      tags: [agent-tasks]
      summary: Get a single agent task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The agent task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /agent-tasks/{id}/approve:
    post:
      operationId: approveAgentTask
      tags: [agent-tasks]
      summary: Approve a pending_review task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Task is not in pending_review status

  /agent-tasks/{id}/reject:
    post:
      operationId: rejectAgentTask
      tags: [agent-tasks]
      summary: Reject a pending_review task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskRejectRequest"
      responses:
        "200":
          description: Task rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Task is not in pending_review status

components:
  schemas:
    AgentTaskSubmit:
      type: object
      required: [taskType]
      properties:
        taskType:
          type: string
          description: >
            Task type identifier. Known types: generate_content, schedule_post,
            publish_post, update_auto_content_settings, update_client_settings,
            pause_autopilot, resume_autopilot.
        payload:
          type: object
          additionalProperties: true
          description: Task-specific parameters (structure varies by taskType)

    AgentTask:
      type: object
      required: [id, userId, taskType, payload, status, ruleSetVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        taskType:
          type: string
        payload:
          type: string
          description: JSON-encoded task parameters
        status:
          type: string
          description: "pending_review | approved | rejected | executed | failed"
        decision:
          type: ["string", "null"]
          description: "Engine decision: auto_approved | requires_review | rejected"
        decisionBy:
          type: ["string", "null"]
          description: Clerk userId of human approver, or 'system' for engine decisions
        decisionAt:
          type: ["string", "null"]
          format: date-time
        decisionNote:
          type: ["string", "null"]
          description: Optional rejection reason from human reviewer
        ruleId:
          type: ["string", "null"]
          description: Identifier of the rule that fired in the approval engine
        ruleSetVersion:
          type: string
          description: Version of the rule set applied (e.g. v1)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentTaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/AgentTask"

    AgentTaskRejectRequest:
      type: object
      properties:
        note:
          type: string
          description: Optional human-readable reason for rejection

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Keyword:
      type: object
      required: [id, keyword, volume, difficulty, intent, service, city, state]
      properties:
        id:
          type: string
        keyword:
          type: string
        volume:
          type: integer
        difficulty:
          type: string
        intent:
          type: string
        service:
          type: string
        city:
          type: string
        state:
          type: string

    KeywordsBulkInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [keyword, volume, difficulty, intent, service, city, state]
            properties:
              keyword: { type: string }
              volume: { type: integer }
              difficulty: { type: string }
              intent: { type: string }
              service: { type: string }
              city: { type: string }
              state: { type: string }

    ArticleDraft:
      type: object
      required: [id, title, keyword, service, project, body, metaTitle, metaDescription, slug, status]
      properties:
        id:
          type: string
        title:
          type: string
        keyword:
          type: string
        keywordId:
          type: ["string", "null"]
        service:
          type: string
        project:
          type: string
        body:
          type: string
        metaTitle:
          type: string
        metaDescription:
          type: string
        slug:
          type: string
        status:
          type: string
        scheduledFor:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        publishedUrl:
          type: ["string", "null"]
        generatedAt:
          type: ["string", "null"]
        verifiedLiveAt:
          type: ["string", "null"]
        lastStatusCode:
          type: ["integer", "null"]
        lastCheckedAt:
          type: ["string", "null"]

    ArticlesBulkInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArticleDraft"

    ArticleUpdate:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        metaTitle: { type: string }
        metaDescription: { type: string }
        slug: { type: string }
        status: { type: string }
        scheduledFor: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        publishedUrl: { type: ["string", "null"] }
        generatedAt: { type: ["string", "null"] }
        verifiedLiveAt: { type: ["string", "null"] }
        lastStatusCode: { type: ["integer", "null"] }
        lastCheckedAt: { type: ["string", "null"] }

    ArticleAsset:
      type: object
      required: [id, articleId, channel, body, status]
      properties:
        id:
          type: string
        articleId:
          type: string
        channel:
          type: string
        body:
          type: string
        status:
          type: string
        publishedUrl:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        updatedAt:
          type: string

    ArticleAssetsBulkInput:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            type: object
            required: [channel, body]
            properties:
              channel: { type: string }
              body: { type: string }
              status: { type: string }
              errorMessage: { type: ["string", "null"] }

    ArticleAssetUpdate:
      type: object
      properties:
        body: { type: string }
        status: { type: string }
        publishedUrl: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }

    KeywordGenInput:
      type: object
      required: [businessName, industry, city, state, mainServices]
      properties:
        businessName: { type: string }
        industry: { type: string }
        city: { type: string }
        state: { type: string }
        mainServices: { type: string }
        targetCustomers: { type: string }

    KeywordGenResult:
      type: object
      required: [keywords]
      properties:
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"

    ArticleGenInput:
      type: object
      required: [title, keyword, service, businessName, industry, city, state]
      properties:
        title: { type: string }
        keyword: { type: string }
        service: { type: string }
        businessName: { type: string }
        industry: { type: string }
        city: { type: string }
        state: { type: string }
        mainServices: { type: string }
        targetCustomers: { type: string }

    ArticleGenResult:
      type: object
      required: [body]
      properties:
        body: { type: string }

    ArticleAssetsGenInput:
      type: object
      required: [title, keyword]
      properties:
        title: { type: string }
        keyword: { type: string }
        service: { type: string }
        businessName: { type: string }
        city: { type: string }
        state: { type: string }
        body: { type: string }

    ArticleAssetsGenResult:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            type: object
            required: [channel, body, status]
            properties:
              channel: { type: string }
              body: { type: string }
              status: { type: string }
              errorMessage: { type: ["string", "null"] }

    RepurposeInput:
      type: object
      required: [businessName, service, city, keyword]
      properties:
        businessName: { type: string }
        service: { type: string }
        city: { type: string }
        state: { type: string }
        keyword: { type: string }

    RepurposeResult:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            type: object
            required: [channel, label, body]
            properties:
              channel: { type: string }
              label: { type: string }
              body: { type: string }

    IntegrationHealthHistoryItem:
      type: object
      required: [provider, status, checked_at, health_score]
      properties:
        provider:
          type: string
          description: Provider identifier (facebook, youtube, google_business, etc.)
        status:
          type: string
          description: "Health status: healthy | warning | failed"
        checked_at:
          type: string
          format: date-time
          description: When this record was captured
        last_success_at:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the last known-healthy check, or null
        error_message:
          type: ["string", "null"]
          description: Sanitized error detail when status is not healthy, or null
        health_score:
          type: integer
          description: "Numeric score: 100=healthy, 50=warning, 0=failed"
        metadata:
          type: ["object", "null"]
          additionalProperties: true
          description: Non-sensitive provider-specific context (no tokens or secrets)

    IntegrationHealthHistoryResponse:
      type: object
      required: [history]
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationHealthHistoryItem"
